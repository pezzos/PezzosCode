# Codex per-project overrides mirror ~/.codex/config.toml.
# See: https://developers.openai.com/codex/config-sample/

# Primary model used by Codex. Default: "gpt-5.3-codex" on all platforms.
model = "gpt-5.3-codex"

# Model used by the /review feature (code reviews). Default: "gpt-5.3-codex".
review_model = "gpt-5.3-codex"

# Provider id selected from [model_providers]. Default: "openai".
model_provider = "openai"

# Reasoning effort: minimal | low | medium | high | xhigh (default: medium; xhigh on gpt-5.3-codex and gpt-5.2)
model_reasoning_effort = "low"

# Reasoning summary: auto | concise | detailed | none (default: auto)
model_reasoning_summary = "none"

# Text verbosity for GPT-5 family (Responses API): low | medium | high (default: medium)
model_verbosity = "low"

# Force-enable reasoning summaries for current model (default: false)
# model_supports_reasoning_summaries = false

# When to ask for command approval:
# - untrusted: only known-safe read-only commands auto-run; others prompt
# - on-failure: auto-run in sandbox; prompt only on failure for escalation
# - on-request: model decides when to ask (default)
# - never: never prompt (risky)
# Note: keep approval_policy unchanged unless the user explicitly requests a change.
approval_policy = "never"

# Filesystem/network sandbox policy for tool calls:
# - read-only (default)
# - workspace-write
# - danger-full-access (no sandbox; extremely risky)
sandbox_mode = "workspace-write"
network_access = false

# URI scheme for clickable citations: vscode (default) | vscode-insiders | windsurf | cursor | none
file_opener = "cursor"

# External notifier program (argv array). When unset: disabled.
# Example: notify = ["notify-send", "Codex"]
notify=[ ]

